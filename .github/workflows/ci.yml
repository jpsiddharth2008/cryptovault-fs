name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make libfuse3-dev fuse3 libsodium-dev pkg-config

      - name: Build
        run: make

      - name: Crypto unit tests
        run: make test-crypto

      - name: Integration tests (mount + file ops)
        run: make test-fs
